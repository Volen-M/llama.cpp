version = 1

# Tuned for RTX 5060 Ti 16 GB + i7-8700K, benchmarked 2026-11-24.
# Server: self-built llama.cpp (build 12722, CUDA 13.5, sm_120a, AVX2) via
#         my-setup\Build-LlamaCpp.ps1
# Model:  Qwen3.8-27B GSQ-RCO IQ3_XXS with built-in MTP head (10.4 GB).
#
#   build / setting            | code t/s | prose t/s | prompt t/s | VRAM
#   prebuilt b10415, draft 4   |   ~61    |   ~37     |    795     | 14.9 GB
#   source build, draft 4      |   70.8   |   ~41     |    848     | 14.3 GB
#   source build, draft 2      |    -     |   47.3    |    851     | 14.3 GB
#   source, draft 4, ctx 112k  |   73.2   |    -      |    852     | 15.0 GB
#   source, draft 4, ctx 128k  |   70.9   |    -      |    848     | 15.7 GB
#
# 2026-11-24: spec-type draft-mtp,ngram-mod (MTP + n-gram copy from context).
# n-gram drafts long runs that already appear in the prompt (code edits, refactors):
#   edit task (re-emit a file with small changes): 86.5 -> 228 t/s (2.6x)
#   fresh code: 67 -> 71 t/s · prose (draft 2): 44.8 -> 47.1 t/s · no extra VRAM
# Tried and rejected: f16 K cache (spills VRAM at 112k, 10x slower prompts),
#   ubatch 1024/2048 (no gain; at 112k ub 1024 OOMs, ub 2048 spills -> 121 t/s prompts).
#
# 2026-11-25: OpenHands agent loop (my-setup/bench-agent.py, 8 tool-call turns, 29k ctx):
#   prompt cache already re-uses the whole history - each turn only processes the new
#   tool output (~3k tok, ~4 s). Still holds with thinking on and with unrelated requests
#   interleaved (cache-ram 8 GiB default restores the slot). No server change needed.
#   OpenHands side: set the LLM's max_input_tokens (~90000) - it can't look up this model's
#   context, so without it the condenser only fires on overflow (summarize-everything reset).
#
# Router mode adds ~0.2 GB on top. 112k keeps ~1.1 GB free for the desktop;
# 128k leaves only ~0.4 GB — if other GPU apps grow, Windows silently spills
# into system RAM and prompt speed collapses (~10x slower).
# Previous configs: model.ini.bak (original), model.ini.prebuilt.bak (2026-11-18).

# Default: coding / agent work (Claude Code etc.) — long drafts pay off on code.
[Qwen3.8-Q4]
hf = ISTA-DASLab/Qwen3.8-27B-GSQ-RCO-GGUF
hf-file = Qwen3.8-27B-GSQ-RCO-IQ3_XXS-mtp.gguf
device = CUDA0
n-gpu-layers = all
flash-attn = on
no-mmproj = true
ctx-size = 114688
cache-type-k = q8_0
cache-type-v = q8_0
spec-type = draft-mtp,ngram-mod
spec-draft-n-max = 4
spec-draft-p-min = 0.2

# Same as default with the full 128k context. Close other GPU-heavy apps first.
[Qwen3.8-Q4-128k]
hf = ISTA-DASLab/Qwen3.8-27B-GSQ-RCO-GGUF
hf-file = Qwen3.8-27B-GSQ-RCO-IQ3_XXS-mtp.gguf
device = CUDA0
n-gpu-layers = all
flash-attn = on
no-mmproj = true
ctx-size = 131072
cache-type-k = q8_0
cache-type-v = q8_0
spec-type = draft-mtp,ngram-mod
spec-draft-n-max = 4
spec-draft-p-min = 0.2

# Chat/prose: short drafts accept better on free text.
[Qwen3.8-Q4-Chat]
hf = ISTA-DASLab/Qwen3.8-27B-GSQ-RCO-GGUF
hf-file = Qwen3.8-27B-GSQ-RCO-IQ3_XXS-mtp.gguf
device = CUDA0
n-gpu-layers = all
flash-attn = on
no-mmproj = true
ctx-size = 114688
cache-type-k = q8_0
cache-type-v = q8_0
spec-type = draft-mtp,ngram-mod
spec-draft-n-max = 2
