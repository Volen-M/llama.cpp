version = 1

# Tuned for RTX 5060 Ti 16 GB + i7-8700K, benchmarked 2026-11-24.
# Server: self-built llama.cpp (build 12722, CUDA 13.5, sm_120a, AVX2) via
#         D:\AI-Dev\Scripts\Build-LlamaCpp.ps1
# Model:  Qwen3.8-27B GSQ-RCO IQ3_XXS with built-in MTP head (10.4 GB).
#
#   build / setting            | code t/s | prose t/s | prompt t/s | VRAM
#   prebuilt b10415, draft 4   |   ~61    |   ~37     |    795     | 14.9 GB
#   source build, draft 4      |   70.8   |   ~41     |    848     | 14.3 GB
#   source build, draft 2      |    -     |   47.3    |    851     | 14.3 GB
#   source, draft 4, ctx 112k  |   73.2   |    -      |    852     | 15.0 GB
#   source, draft 4, ctx 128k  |   70.9   |    -      |    848     | 15.7 GB
#
# Router mode adds ~0.2 GB on top. 112k keeps ~1.1 GB free for the desktop;
# 128k leaves only ~0.4 GB — if other GPU apps grow, Windows silently spills
# into system RAM and prompt speed collapses (~10x slower).
# Previous configs: model.ini.bak (original), model.ini.prebuilt.bak (2026-11-18).

# Default: coding / agent work (Claude Code etc.) — long drafts pay off on code.
[Qwen3.8-Q4]
hf = ISTA-DASLab/Qwen3.8-27B-GSQ-RCO-GGUF
hf-file = Qwen3.8-27B-GSQ-RCO-IQ3_XXS-mtp.gguf
device = CUDA0
n-gpu-layers = all
flash-attn = on
no-mmproj = true
ctx-size = 114688
cache-type-k = q8_0
cache-type-v = q8_0
spec-type = draft-mtp
spec-draft-n-max = 4
spec-draft-p-min = 0.2

# Same as default with the full 128k context. Close other GPU-heavy apps first.
[Qwen3.8-Q4-128k]
hf = ISTA-DASLab/Qwen3.8-27B-GSQ-RCO-GGUF
hf-file = Qwen3.8-27B-GSQ-RCO-IQ3_XXS-mtp.gguf
device = CUDA0
n-gpu-layers = all
flash-attn = on
no-mmproj = true
ctx-size = 131072
cache-type-k = q8_0
cache-type-v = q8_0
spec-type = draft-mtp
spec-draft-n-max = 4
spec-draft-p-min = 0.2

# Chat/prose: short drafts accept better on free text.
[Qwen3.8-Q4-Chat]
hf = ISTA-DASLab/Qwen3.8-27B-GSQ-RCO-GGUF
hf-file = Qwen3.8-27B-GSQ-RCO-IQ3_XXS-mtp.gguf
device = CUDA0
n-gpu-layers = all
flash-attn = on
no-mmproj = true
ctx-size = 114688
cache-type-k = q8_0
cache-type-v = q8_0
spec-type = draft-mtp
spec-draft-n-max = 2
